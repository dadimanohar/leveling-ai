name: leveling-v0.12-ci
on:
  push:
    branches: [main]
jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Package source
        run: |
          mkdir -p /tmp/leveling-v0.12
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/leveling-v0.12-source.tar.gz .
          cd /tmp
          zip -j leveling-v0.12-source.zip leveling-v0.12-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: leveling-v0.12-source
          path: /tmp/leveling-v0.12-source.zip
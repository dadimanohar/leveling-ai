name: leveling-v0.12-ci
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-build-package:
    runs-on: ubuntu-latest
    env:
      LEVELING_MASTER_KEY: ci-only-change-me-leveling-v12
      LEVELING_WORKSPACE: ./workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Start local core
        run: nohup node server/index.mjs >/tmp/leveling.log 2>&1 &
      - run: sleep 2
      - run: npm run smoke
      - if: always()
        run: cat /tmp/leveling.log || true
      - name: Package source
        run: |
          rm -f /tmp/leveling-v0.12-source.zip
          zip -r /tmp/leveling-v0.12-source.zip . -x ".git/*" "node_modules/*" "dist/*" ".leveling/*" "*.log" "workspace/smoke.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: leveling-v0.12-source
          path: /tmp/leveling-v0.12-source.zip

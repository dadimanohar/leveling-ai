name: leveling-v0.12-ci
on:
  push:
    branches: [main]
jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Package source
        run: |
          rm -f /tmp/leveling-v0.12-source.zip
          zip -r /tmp/leveling-v0.12-source.zip . -x ".git/*" "node_modules/*" "dist/*" ".leveling/*" "*.log"
      - uses: actions/upload-artifact@v4
        with:
          name: leveling-v0.12-source
          path: /tmp/leveling-v0.12-source.zip